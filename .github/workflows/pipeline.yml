name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_QUALITY: "ga"
  CONFIGURATION: Release

jobs:
  build-test-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink / versioning

      # On a release, the tag drives the version. Otherwise fall back to the
      # version in the project file rather than a literal like 0.0.0-dev: package
      # validation compares the built assembly against the published baseline and
      # rejects an assembly version lower than it.
      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/EventBus/EventBus.csproj | head -1)
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version from the release tag or src/EventBus/EventBus.csproj."
            exit 1
          fi

          echo "Resolved version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build
          --no-restore
          -c ${{ env.CONFIGURATION }}
          -warnaserror
          -p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.VERSION }}

      # xunit.v3 4.x runs on Microsoft.Testing.Platform, so the old VSTest flags
      # (--logger trx, --collect "XPlat Code Coverage") no longer apply. Options
      # after `--` go to the test runner itself.
      - name: Test
        run: >
          dotnet test --no-build -c ${{ env.CONFIGURATION }} --
          --report-xunit-trx --report-xunit-trx-filename test-results.trx
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false

      - name: Pack
        run: >
          dotnet pack src/EventBus/EventBus.csproj
          --no-build
          -c ${{ env.CONFIGURATION }}
          -o ./artifacts
          -p:ContinuousIntegrationBuild=true
          /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg

      - name: Upload symbol package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-symbols
          path: ./artifacts/*.snupkg

  publish:
    name: Publish to NuGet.org
    needs: build-test-pack
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    # Trusted publishing swaps a GitHub OIDC token for a short-lived NuGet API
    # key, so no long-lived secret is stored here. `id-token: write` is what lets
    # the runner mint that OIDC token; a job-level block replaces the workflow
    # default entirely, so `contents: read` is restated rather than inherited.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_QUALITY }}

      - name: Download packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-packages
          path: ./artifacts

      - name: Download symbols
        uses: actions/download-artifact@v8.0.1
        with:
          name: nuget-symbols
          path: ./artifacts

      # Checked up front so a missing variable reports itself plainly instead of
      # surfacing as an opaque OIDC exchange failure inside the login action.
      - name: Verify trusted publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository variable is not set. It must be your NuGet.org username, and it must match the owner of the trusted publishing policy 'EventBus-GitHubActions'. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          echo "Publishing to NuGet.org as '$NUGET_USER' via trusted publishing."

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also uploads the matching .snupkg sitting beside it.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Trusted publishing returned an empty API key. Check that the 'EventBus-GitHubActions' policy on NuGet.org points at repository ${{ github.repository }} and workflow 'pipeline.yml', and that it is still enabled."
            exit 1
          fi

          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
